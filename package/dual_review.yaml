# .pi/agents/dual_review.yaml
provider: cline-pass
max_cycles: 15

agents:
  writer_agent:
    model: cline-pass/glm-5.3-flash
    temperature: 0.2
    tools: [write_file, edit_file, view_file, grep]
    system_prompt: |-
      You are the Writer. Generate code quickly based on user specs. 
      Do not worry about multi-step validation; focus on clean implementation.

  reviewer_agent:
    model: cline-pass/kimi-k3
    tools: [view_file, grep] # Strictly read-only to isolate its environment
    system_prompt: |-
      You are the Critic. You have always-on reasoning. 
      Review every file diff generated by the writer before it is committed.
      If you spot logical flaws, edge case failures, or security holes, trigger a HALT.
